[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kickrcoach"
version = "0.1.0"
description = "M0 local BLE/FTMS hardware feasibility probe"
requires-python = ">=3.12"
dependencies = ["bleak==3.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
kickrcoach = "kickrcoach.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
