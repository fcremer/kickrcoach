name: Protocol and adapter tests (no Bluetooth hardware)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install '.[dev]'
      - name: Protocol and simulator tests
        run: python -m pytest -q
      - name: CLI smoke test (simulation)
        run: kickrcoach probe --duration-sec 2
      - name: M1 deterministic adapter smoke test
        run: kickrcoach-adapters --steps 20
